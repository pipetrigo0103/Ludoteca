body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}

header.top{padding-block:20px 6px}

.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--muted)}

const byName = new Map(all.map(g=>[g.name,g]));
for(const e of all.filter(g=>g.exp)){
  let hosts=e.base.map(n=>byName.get(n)).filter(Boolean);
  // an expansion of an owned expansion (e.g. a 5-6 extension) belongs to that expansion's base game
  hosts=hosts.flatMap(h=>h.exp? h.base.map(n=>byName.get(n)).filter(x=>x&&!x.exp) : [h]);
  hosts=[...new Set(hosts)];
  e.hosts=hosts;
  hosts.forEach(h=>h.exps.push(e));
}
for(const g of all){
  g.cminp=Math.min(g.minp??99,...g.exps.map(e=>e.minp??99)); if(g.cminp===99)g.cminp=g.minp;
  g.cmaxp=Math.max(g.maxp??0,...g.exps.map(e=>e.maxp??0));
  g.cmaxt=Math.max(g.maxt??g.mint??0,...g.exps.map(e=>e.maxt??e.mint??0));
  g.bestSet=parseSet(g.best);
  g.domEs=g.dom.map(d=>DOM_ES[d]||d);

const tog=(set,v)=>set.has(v)?set.delete(v):set.add(v);
$('q').addEventListener('input',e=>{S.q=e.target.value;render()});
$('fC').addEventListener('change',e=>{S.c=e.target.value;render()});
$('sort').addEventListener('change',e=>{S.sort=e.target.value;save();render()});
['useExp','bestOnly','showExp'].forEach(k=>$(k).addEventListener('change',e=>{S[k]=e.target.checked;save();render()}));
function setPanel(open){$('panel').hidden=!open;$('morebtn').setAttribute('aria-expanded',open);$('morelbl').textContent=open?'Cerrar':'Filtros';
  if(!open)window.scrollTo({top:Math.min(window.scrollY,$('grid').getBoundingClientRect().top+window.scrollY-170),behavior:'smooth'})}
$('morebtn').addEventListener('click',()=>setPanel($('panel').hidden));
$('apply').addEventListener('click',()=>setPanel(false));
$('clear').addEventListener('click',()=>{Object.assign(S,{q:'',p:null,t:null,c:''});S.w.clear();S.d.clear();S.m.clear();S.bestOnly=false;$('q').value='';render()});

/* ---------- filtering ---------- */
function match(g){
  if(S.q){const q=S.q.toLowerCase().normalize('NFD').replace(/\p{Diacritic}/gu,'').replace(/[!¡?¿'’:·.,&–-]/g,' ').trim();if(q&&!q.split(/\s+/).every(w=>g.search.includes(w)))return false}
  if(S.p){const lo=S.useExp?g.cminp:g.minp,hi=S.useExp?g.cmaxp:g.maxp;
    if(S.p===10?!(hi>=10):!(lo<=S.p&&S.p<=hi))return false;
    if(S.bestOnly&&!(S.p===10?[...g.bestSet].some(n=>n>=10):g.bestSet.has(S.p)))return false}
  if(S.t){const t=g.mint||g.maxt;if(!t)return false;if(S.t===999?(g.maxt||t)<120:t>S.t)return false}
  if(S.w.size){if(!g.w||![...S.w].some(i=>g.w>=W_LVL[i][1]&&g.w<W_LVL[i][2]))return false}
  if(S.d.size&&![...S.d].some(d=>g.dom.includes(d)))return false;
  if(S.m.size&&![...S.m].every(k=>MECH[k].some(m=>g.mech.includes(m)||g.exps.some(e=>e.mech.includes(m)))))return false;
  if(S.c&&!g.cat.includes(S.c))return false;
  return true;
}
const SORTS={name:(a,b)=>a.name.localeCompare(b.name,'es'),rating:(a,b)=>(b.r||0)-(a.r||0),rank:(a,b)=>(a.rank||1e9)-(b.rank||1e9),
  wdesc:(a,b)=>(b.w||0)-(a.w||0),wasc:(a,b)=>(a.w||9)-(b.w||9),tasc:(a,b)=>(a.mint||a.maxt||999)-(b.mint||b.maxt||999),year:(a,b)=>(b.year||0)-(a.year||0)};

function dots(w){const n=Math.round((w||0));return `<span class="dots">${[1,2,3,4,5].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</span>`}
function card(g){
  const pl=g.cmaxp>g.maxp||g.cminp<g.minp;
  return `<button class="card" data-id="${g.id}">
    <div class="cover"><div class="blur" style="background-image:url('${g.img}')"></div><img loading="lazy" src="${g.img}" alt="">
      ${g.exps.length?`<span class="badge">+${g.exps.length} exp.</span>`:g.exp?`<span class="badge exp">Expansión</span>`:''}
      ${g.r?`<span class="score">${g.r.toFixed(1)}</span>`:''}</div>
    <div class="cbody"><div class="cname">${esc(g.name)}</div>
      <div class="meta"><span>${ic.user}${rng(g.minp,g.maxp)}${pl?` <em>(${rng(g.cminp,g.cmaxp)})</em>`:''}</span><span>${ic.clock}${tTxt(g).replace(' min','′')}</span></div>
      ${g.w?`<div class="wt">${dots(g.w)} ${g.w.toFixed(1)}</div>`:''}
    </div></button>`;
}
function render(){
  document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',S.p===+b.dataset.p));
  document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-pressed',S.t===+b.dataset.t));
  document.querySelectorAll('[data-w]').forEach(b=>b.setAttribute('aria-pressed',S.w.has(+b.dataset.w)));
  document.querySelectorAll('[data-d]').forEach(b=>b.setAttribute('aria-pressed',S.d.has(b.dataset.d)));
  document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',S.m.has(b.dataset.m)));
  $('sort').value=S.sort;$('fC').value=S.c;$('useExp').checked=S.useExp;$('bestOnly').checked=S.bestOnly;$('showExp').checked=S.showExp;
  const nf=S.w.size+S.d.size+S.m.size+(S.c?1:0)+(S.bestOnly?1:0);$('nfil').hidden=!nf;$('nfil').textContent=nf;
  const pool=all.filter(g=>S.showExp||isStandalone(g));
  const res=pool.filter(match).sort(SORTS[S.sort]);
  $('grid').innerHTML=res.length?res.map(card).join(''):`<div class="empty">Ningún juego cumple estos filtros.<br><button class="clear" onclick="document.getElementById('clear').click()">Limpiar filtros</button></div>`;
  $('count').innerHTML=`<b>${res.length}</b> de ${pool.length} juegos`;$('apply').textContent=`Filtrar · ver ${res.length} juego${res.length===1?'':'s'}`;
  $('hint').textContent=S.p&&S.useExp?'Entre paréntesis: jugadores con expansiones':'';
}
const base=all.filter(isStandalone), exN=all.filter(g=>g.exp).length;
$('stats').innerHTML=`<div><b>${base.length}</b>juegos</div><div><b>${exN}</b>expansiones</div><div><b>${(base.reduce((s,g)=>s+(g.w||0),0)/base.filter(g=>g.w).length).toFixed(1)}</b>peso medio</div>`;

/* ---------- detail sheet ---------- */
const sheet=$('sheet'),scrim=$('scrim');
$('grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openG(+c.dataset.id)});
sheet.addEventListener('click',e=>{const x=e.target.closest('[data-open]');if(x){e.preventDefault();openG(+x.dataset.open)}if(e.target.closest('.close'))closeG()});
scrim.addEventListener('click',closeG);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeG()});
function stat(l,v,x){return `<div class="st"><small>${l}</small><b>${v}</b>${x?`<div class="x">${x}</div>`:''}</div>`}
function openG(id){
  const g=all.find(x=>x.id===id);if(!g)return;
  const fmtBest=s=>s?s.replace(/-null/g,'+').replace(/,/g,', '):'—';
  const withExp=g.exps.length&&(g.cmaxp!==g.maxp||g.cminp!==g.minp||g.cmaxt>(g.maxt||0));
  sheet.innerHTML=`<button class="close" aria-label="Cerrar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="hero"><div class="blur" style="background-image:url('${g.img}')"></div><img src="${g.img}" alt="Portada de ${esc(g.name)}"></div>
  <div class="dbody">
    <div><h2 class="dtitle" id="dt">${esc(g.name)}</h2>
      <div class="dsub">${g.year||''}${g.des&&g.des.length?' · '+esc(g.des.join(', ')):''}${g.exp&&g.hosts.length?' · Expansión de '+g.hosts.map(h=>`<a href="#" data-open="${h.id}" class="bgg" style="display:inline">${esc(h.name)}</a>`).join(', '):''}</div>${g.alt?`<div class="dsub">También conocido como: ${esc(g.alt.split(' ').length&&ALTlist(g.name))}</div>`:''}</div>
    <div class="statgrid">
      ${stat('Jugadores',rng(g.minp,g.maxp))}${stat('Mejor con',fmtBest(g.best))}${stat('Duración',tTxt(g))}
      ${stat('Peso',g.w?g.w.toFixed(2)+'<span class="x"> /5</span>':'—',g.w?dots(g.w):'')}${stat('Nota BGG',g.r?g.r.toFixed(1):'—')}${stat(g.rank?'Ranking':'Edad',g.rank?'#'+g.rank.toLocaleString('es'):(g.age?g.age+'+':'—'),g.rank&&g.age?g.age+'+ años':'')}
    </div>
    ${withExp?`<div class="withexp">Con tus expansiones: <b>${rng(g.cminp,g.cmaxp)} jugadores</b>${g.cmaxt>(g.maxt||0)?` · hasta <b>${g.cmaxt} min</b>`:''}</div>`:''}
    ${g.desc?`<p class="desc">${esc(g.desc)}</p>`:''}
    ${g.exps.length?`<div class="sec"><h4>Tus expansiones (${g.exps.length})</h4><div class="exps">${g.exps.map(e=>{
        const morep=(e.maxp||0)>(g.maxp||0), moret=(e.maxt||0)>(g.maxt||0);
        return `<button class="exp" data-open="${e.id}"><img loading="lazy" src="${e.img}" alt=""><div><div class="t">${esc(e.name.replace(g.name,'').replace(/^[\s:–-]+/,'')||e.name)}</div>
        <div class="m">${ic.user} ${rng(e.minp,e.maxp)}${morep?` <span class="plus">· hasta ${e.maxp} jug.</span>`:''} &nbsp; ${ic.clock} ${tTxt(e)}${moret?` <span class="plus">· +tiempo</span>`:''}${e.w?` &nbsp; peso ${e.w.toFixed(1)}`:''}</div></div></button>`}).join('')}</div></div>`:''}
    ${g.domEs.length||g.cat.length?`<div class="sec"><h4>Tipo y temática</h4><div class="tags">${g.domEs.map(d=>`<span class="tag dom">${d}</span>`).join('')}${g.cat.map(c=>`<span class="tag">${esc(CAT_ES[c]||c)}</span>`).join('')}</div></div>`:''}
    ${g.mech.length?`<div class="sec"><h4>Mecánicas</h4><div class="tags">${g.mech.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div></div>`:''}
    ${typeof g.lang==='number'?`<div class="sec"><h4>Idioma</h4><div class="tags"><span class="tag">${LANG[g.lang]}</span></div></div>`:''}
    <a class="bgg" href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" rel="noopener">Ver en BoardGameGeek ↗</a>
  </div>`;
  sheet.scrollTop=0;sheet.classList.add('on');scrim.classList.add('on');sheet.querySelector('.close').focus({preventScroll:true});
}
function closeG(){sheet.classList.remove('on');scrim.classList.remove('on')}
render();
</script>

</body></html>
