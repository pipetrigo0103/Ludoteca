:root[data-theme="dark"]{

  --accent:#7FA68C; --accent-ink:#192B38; --teal:#7FA68C; --teal-soft:#2E5458; --on-teal:#192B38; --shadow:0 1px 2px rgb(0 0 0/.3),0 8px 24px rgb(0 0 0/.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{padding-block:20px 6px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
@font-face{font-family:'Citadel';src:url('citadel.ttf') format('truetype');font-display:swap}
h1{font-family:'Citadel',var(--f-display);font-weight:400;font-size:clamp(34px,8vw,52px);letter-spacing:0;margin:0;line-height:1;color:var(--ink);-webkit-text-stroke:.012em currentColor}
h1 .d20{width:.62em;height:.62em;vertical-align:-.02em;margin:0 .02em;color:var(--teal)}
h1 span{color:var(--teal);font-size:.62em}
h1 .logo{width:1.15em;height:1.15em;border-radius:24%;vertical-align:-.18em;margin-right:.3em;box-shadow:var(--shadow)}
.sub{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.stats{display:flex;gap:16px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);font-weight:700}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-block:10px 8px;border-bottom:1px solid var(--line)}
.searchrow{display:flex;gap:8px}

.rail::-webkit-scrollbar{display:none}

.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}

.panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 24px;padding-block:12px 6px}
.panel[hidden]{display:none}
.panel{max-height:calc(100dvh - 210px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:0}
.applyrow{grid-column:1/-1;position:sticky;bottom:0;background:var(--bg);padding-block:10px 12px;border-top:1px solid var(--line)}
.apply{width:100%;height:48px;border:0;border-radius:12px;background:var(--teal);color:var(--on-teal);font-weight:700;font-size:16px}
.morebtn[aria-expanded="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500;padding:4px 0}
.toggle input{width:18px;height:18px;accent-color:var(--teal)}
select{width:100%;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:0 10px}
.clear{background:none;border:0;color:var(--teal);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}

.resline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:14px 10px;color:var(--muted);font-size:13.5px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;padding-bottom:48px}

.card:hover{transform:translateY(-2px)}
.cover{position:relative;aspect-ratio:1/1;background:var(--surface-2);overflow:hidden}
.cover .blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(18px) saturate(1.2);opacity:.55}
.cover img{position:relative;width:100%;height:100%;object-fit:contain;padding:10px;filter:drop-shadow(0 4px 8px rgb(0 0 0/.25))}
.badge{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--bg);font-size:11.5px;font-weight:700;border-radius:99px;padding:2px 8px}
.badge.exp{background:var(--teal);color:var(--on-teal)}
.score{position:absolute;top:8px;right:8px;background:var(--surface);color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:13px;border-radius:8px;padding:1px 7px;font-variant-numeric:tabular-nums}
.cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:7px;flex:1}
.cname{font-family:var(--f-display);font-weight:700;font-size:15.5px;line-height:1.15;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:auto}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta em{font-style:normal;color:var(--teal);font-weight:700}
.wt{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dots{display:flex;gap:3px}
.dots i{width:14px;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--teal)}
.empty{grid-column:1/-1;text-align:center;padding:60px 10px;color:var(--muted)}

.scrim{position:fixed;inset:0;background:rgb(10 14 20/.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;background:var(--surface);color:var(--ink);overflow-y:auto;overscroll-behavior:contain;

.bgg{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--teal);text-decoration:none}

function match(g){

  if(S.p){const lo=S.useExp?g.cminp:g.minp,hi=S.useExp?g.cmaxp:g.maxp;
    if(S.p===10?!(hi>=10):!(lo<=S.p&&S.p<=hi))return false;
    if(S.bestOnly&&!(S.p===10?[...g.bestSet].some(n=>n>=10):g.bestSet.has(S.p)))return false}
  if(S.t){const t=g.mint||g.maxt;if(!t)return false;if(S.t===999?(g.maxt||t)<120:t>S.t)return false}
  if(S.w.size){if(!g.w||![...S.w].some(i=>g.w>=W_LVL[i][1]&&g.w<W_LVL[i][2]))return false}
  if(S.d.size&&![...S.d].some(d=>g.dom.includes(d)))return false;
  if(S.m.size&&![...S.m].every(k=>MECH[k].some(m=>g.mech.includes(m)||g.exps.some(e=>e.mech.includes(m)))))return false;
  if(S.c&&!g.cat.includes(S.c))return false;

}

  <div class="hero"><div class="blur" style="background-image:url('${g.img}')"></div><img src="${g.img}" alt="Portada de ${esc(g.name)}"></div>
  <div class="dbody">
    <div><h2 class="dtitle" id="dt">${esc(g.name)}</h2>
      <div class="dsub">${g.year||''}${g.des&&g.des.length?' · '+esc(g.des.join(', ')):''}${g.exp&&g.hosts.length?' · Expansión de '+g.hosts.map(h=>`<a href="#" data-open="${h.id}" class="bgg" style="display:inline">${esc(h.name)}</a>`).join(', '):''}</div>${g.alt?`<div class="dsub">También conocido como: ${esc(g.alt.split(' ').length&&ALTlist(g.name))}</div>`:''}</div>
    <div class="statgrid">
      ${stat('Jugadores',rng(g.minp,g.maxp))}${stat('Mejor con',fmtBest(g.best))}${stat('Duración',tTxt(g))}
      ${stat('Peso',g.w?g.w.toFixed(2)+'<span class="x"> /5</span>':'—',g.w?dots(g.w):'')}${stat('Nota BGG',g.r?g.r.toFixed(1):'—')}${stat(g.rank?'Ranking':'Edad',g.rank?'#'+g.rank.toLocaleString('es'):(g.age?g.age+'+':'—'),g.rank&&g.age?g.age+'+ años':'')}
    </div>
    ${withExp?`<div class="withexp">Con tus expansiones: <b>${rng(g.cminp,g.cmaxp)} jugadores</b>${g.cmaxt>(g.maxt||0)?` · hasta <b>${g.cmaxt} min</b>`:''}</div>`:''}
    ${g.desc?`<p class="desc">${esc(g.desc)}</p>`:''}
    ${g.exps.length?`<div class="sec"><h4>Tus expansiones (${g.exps.length})</h4><div class="exps">${g.exps.map(e=>{
        const morep=(e.maxp||0)>(g.maxp||0), moret=(e.maxt||0)>(g.maxt||0);
        return `<button class="exp" data-open="${e.id}"><img loading="lazy" src="${e.img}" alt=""><div><div class="t">${esc(e.name.replace(g.name,'').replace(/^[\s:–-]+/,'')||e.name)}</div>
        <div class="m">${ic.user} ${rng(e.minp,e.maxp)}${morep?` <span class="plus">· hasta ${e.maxp} jug.</span>`:''} &nbsp; ${ic.clock} ${tTxt(e)}${moret?` <span class="plus">· +tiempo</span>`:''}${e.w?` &nbsp; peso ${e.w.toFixed(1)}`:''}</div></div></button>`}).join('')}</div></div>`:''}
    ${g.domEs.length||g.cat.length?`<div class="sec"><h4>Tipo y temática</h4><div class="tags">${g.domEs.map(d=>`<span class="tag dom">${d}</span>`).join('')}${g.cat.map(c=>`<span class="tag">${esc(CAT_ES[c]||c)}</span>`).join('')}</div></div>`:''}
    ${g.mech.length?`<div class="sec"><h4>Mecánicas</h4><div class="tags">${g.mech.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}</div></div>`:''}
    ${typeof g.lang==='number'?`<div class="sec"><h4>Idioma</h4><div class="tags"><span class="tag">${LANG[g.lang]}</span></div></div>`:''}
    <a class="bgg" href="https://boardgamegeek.com/boardgame/${g.id}" target="_blank" rel="noopener">Ver en BoardGameGeek ↗</a>
  </div>`;
  sheet.scrollTop=0;sheet.classList.add('on');scrim.classList.add('on');sheet.querySelector('.close').focus({preventScroll:true});
}
function closeG(){sheet.classList.remove('on');scrim.classList.remove('on')}
render();
</script>

</body></html>
